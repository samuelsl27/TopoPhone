# Integración continua de TopoPhone (S001/RF-25, S001/RF-28).
# Cada push y cada pull request (también desde forks) pasan todas las comprobaciones;
# cualquier fallo marca el cambio como no apto. La publicación (release.yml) lo reutiliza.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Comprobaciones
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Código (con etiquetas, para la versión)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: uv
        uses: astral-sh/setup-uv@v10

      - name: Ficheros prohibidos (S001/RF-29)
        run: uv run --project tools tools/repo/forbidden_files.py

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Tests de tools/ y de los workflows
        run: uv run --project tools pytest tools

      - name: Trazabilidad RF y tests (S001/RF-26, S001/RF-35)
        run: uv run --project tools tools/trazabilidad/rf_report.py

      - name: Gradle check (tests, Lint, ktlint, reglas de módulos, telemetría, Kover)
        run: ./gradlew check --stacktrace

      - name: Informes de fallo
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informes
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
