# Integración continua de TopoPhone (S001/RF-25, S001/RF-28).
# Cada push y cada pull request (también desde forks) pasan todas las comprobaciones;
# cualquier fallo marca el cambio como no apto. La publicación (release.yml) lo reutiliza.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Comprobaciones
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Código (con etiquetas, para la versión)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: uv
        uses: astral-sh/setup-uv@v10.3.0

      # Robolectric baja android-all de Maven Central y el CI recibe a veces HTTP 429: se guarda en caché.
      - name: Caché de Robolectric
        id: robolectric-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Ficheros prohibidos (S001/RF-29)
        run: uv run --project tools tools/repo/forbidden_files.py

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Tests de tools/ y de los workflows
        run: uv run --project tools pytest tools

      - name: Trazabilidad RF y tests (S001/RF-26, S001/RF-35)
        run: uv run --project tools tools/trazabilidad/rf_report.py

      # Los tests de app (miles con Robolectric) van en el job app-tests, uno por variante y cada uno en su runner:
      # todos en el mismo runner lo dejaban sin memoria y perdía la comunicación.
      - name: Gradle check (tests, Lint, ktlint, reglas de módulos, telemetría, Kover)
        run: >-
          ./gradlew check --stacktrace --continue --no-parallel
          -x :app:testStandardDebugUnitTest
          -x :app:testStandardReleaseUnitTest

      - name: Guardar caché de Robolectric
        if: always() && steps.robolectric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Informes de fallo
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informes
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  app-tests:
    name: Tests de app (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [StandardDebug, StandardRelease]
    steps:
      - name: Código (con etiquetas, para la versión)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Caché de Robolectric
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      # La memoria usada se anota cada 2 minutos: si el runner vuelve a caerse, el log dice si fue por memoria.
      - name: Gradle test de app (${{ matrix.variant }})
        run: |
          ( while sleep 120; do free -m | awk '/^Mem/ {print "Memoria usada: " $3 " de " $2 " MB"}'; done ) &
          ./gradlew ":app:test${{ matrix.variant }}UnitTest" --stacktrace --continue --no-parallel

      - name: Informes de fallo
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informes-app-${{ matrix.variant }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
