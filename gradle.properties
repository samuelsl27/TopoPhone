# -Xss8m: la pila por defecto de los hilos del demonio no bastó una vez para D8 en dexBuilderExperimentalDebug (S044, StackOverflowError)
org.gradle.jvmargs=-Xmx4g -Xss8m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
